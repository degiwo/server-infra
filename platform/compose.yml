# Platform services
# Images are deliberately pinned; Dependabot proposes updates, rollout is manual.
name: platform

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: platform
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - platform
  
  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      APPS_DOMAIN: ${APPS_DOMAIN:?}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LLDAP_ADMIN_PASSWORD:?}
    volumes:
      - ./authelia:/config
      - authelia_data:/data
    labels:
      caddy: auth.${APPS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9091}}"
    networks:
      - platform
    depends_on:
      lldap:
        condition: service_healthy
    
  lldap:
    image: lldap/lldap:v0.6-alpine
    restart: unless-stopped
    environment:
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN:?}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:?}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:17170:17170"
    volumes:
      - lldap_data:/data
    labels:
      caddy: users.${APPS_DOMAIN}
      caddy.import: authelia
      caddy.reverse_proxy: "{{upstreams 17170}}"
    networks:
      - platform

networks:
  platform:
    name: platform

volumes:
  # Certificates. Not backed up – Caddy fetches them again when needed.
  caddy_data:
  # Authelia DB (sessions, login attempts).
  authelia_data:
  # LLDAP DB (users, groups, password hashes).
  lldap_data:
